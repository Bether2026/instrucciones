<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0d0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bether Admin">
<link rel="manifest" id="pwaManifest">
<title>Bether Studio · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:     #0d0a14; --bg-2: #140e1e; --bg-3: #1a1228;
  --surface: rgba(255,255,255,.04);
  --surface-2: rgba(255,255,255,.07);
  --border:  rgba(255,255,255,.09);
  --border-2:rgba(255,255,255,.16);
  --v1:#b66fff; --v2:#7c3aff;
  --p1:#ff6bb0; --p2:#ff3e8a;
  --c1:#00e5c0;
  --o1:#ff9d4d;
  --text:  #f0eaf8;
  --text-2:rgba(240,234,248,.6);
  --text-3:rgba(240,234,248,.32);
  --green: #00e5c0; --red:#ff6b8a; --amber:#ff9d4d; --blue:#88b8e8;
  --serif: 'Instrument Serif',Georgia,serif;
  --display:'Syne',sans-serif;
  --sans:  'DM Sans','Helvetica Neue',sans-serif;
  --ease:  cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);height:100%;-webkit-font-smoothing:antialiased;overflow:hidden;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ══ BG ══════════════════════════════════════ */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.bg-mesh{
  position:absolute;inset:-50%;
  background:
    radial-gradient(ellipse 60% 50% at 15% 15%,rgba(124,58,255,.2),transparent 55%),
    radial-gradient(ellipse 50% 60% at 85% 10%,rgba(255,107,176,.15),transparent 52%),
    radial-gradient(ellipse 60% 40% at 55% 85%,rgba(0,229,192,.12),transparent 52%),
    radial-gradient(ellipse 40% 50% at 8%  78%,rgba(255,157,77,.14),transparent 48%);
  animation:meshMove 22s ease-in-out infinite alternate;
}
@keyframes meshMove{
  0%  {transform:translate(0,0)    rotate(0)   scale(1);}
  33% {transform:translate(2%,3%)  rotate(3deg)scale(1.04);}
  66% {transform:translate(-2%,1%) rotate(-2deg)scale(1.07);}
  100%{transform:translate(1%,-2%) rotate(4deg)scale(1.03);}
}
.bg-orb{position:absolute;border-radius:50%;filter:blur(65px);
  animation:var(--anim) var(--dur) ease-in-out infinite alternate;animation-delay:var(--dl,0s);}
.orb-a{width:40vw;height:40vw;max-width:500px;max-height:500px;top:-10%;left:-8%;
  background:radial-gradient(circle,rgba(124,58,255,.28),transparent 70%);--dur:15s;--anim:orbA;}
.orb-b{width:35vw;height:35vw;max-width:420px;max-height:420px;top:15%;right:-10%;
  background:radial-gradient(circle,rgba(255,62,138,.22),transparent 70%);--dur:18s;--dl:-6s;--anim:orbB;}
.orb-c{width:30vw;height:30vw;max-width:360px;max-height:360px;bottom:-8%;left:25%;
  background:radial-gradient(circle,rgba(0,229,192,.16),transparent 70%);--dur:20s;--dl:-10s;--anim:orbC;}
@keyframes orbA{0%{transform:translate(0,0) scale(1);}50%{transform:translate(6%,10%) scale(1.12);}100%{transform:translate(3%,-6%) scale(.92);}}
@keyframes orbB{0%{transform:translate(0,0) scale(1);}50%{transform:translate(-8%,6%) scale(1.18);}100%{transform:translate(-4%,12%) scale(.94);}}
@keyframes orbC{0%{transform:translate(0,0) scale(1);}50%{transform:translate(5%,-8%) scale(1.1);}100%{transform:translate(-6%,4%) scale(1.15);}}
.bg-grid{
  position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:52px 52px;
  animation:gridShift 28s linear infinite;
  mask-image:radial-gradient(ellipse 85% 85% at 50% 50%,black 40%,transparent 100%);
}
@keyframes gridShift{0%{background-position:0 0;}100%{background-position:52px 52px;}}
.bg-noise{position:absolute;inset:0;opacity:.04;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' seed='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}

/* ══ LOGIN ════════════════════════════════════ */
#loginScreen{
  position:fixed;inset:0;z-index:200;
  display:flex;align-items:center;justify-content:center;
  background:rgba(8,5,14,.96);backdrop-filter:blur(12px);
}
#loginScreen.hidden{display:none;}
.login-box{
  background:rgba(255,255,255,.04);border:1px solid var(--border-2);
  border-radius:20px;padding:2.8rem 2.2rem;width:min(380px,90vw);text-align:center;
  box-shadow:0 24px 80px rgba(0,0,0,.5),0 0 0 1px rgba(182,111,255,.1);
  position:relative;overflow:hidden;
}
.login-box::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--v1),var(--p1),transparent);
}
.login-logo{
  font-family:var(--display);font-size:1.8rem;font-weight:800;
  background:linear-gradient(135deg,var(--v1),var(--p1),var(--c1));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:.2rem;
}
.login-studio{
  font-family:var(--display);font-size:.65rem;font-weight:700;letter-spacing:.35em;
  text-transform:uppercase;color:var(--text-3);margin-bottom:1.6rem;
}
.login-rule{width:40px;height:1px;background:linear-gradient(90deg,transparent,var(--v1),transparent);margin:.6rem auto 1.4rem;}
.login-sub{font-family:var(--serif);font-style:italic;font-size:.9rem;color:var(--text-2);margin-bottom:1.4rem;}
.login-input{
  width:100%;background:rgba(255,255,255,.05);
  border:1.5px solid var(--border);border-radius:10px;
  padding:.75rem 1rem;color:var(--text);font-size:.9rem;
  outline:none;text-align:center;letter-spacing:.15em;
  transition:border-color .25s,box-shadow .25s;margin-bottom:.8rem;
}
.login-input:focus{border-color:var(--v1);box-shadow:0 0 0 3px rgba(182,111,255,.12);}
.login-btn{
  width:100%;
  background:linear-gradient(135deg,var(--v2),var(--v1),var(--p2));
  color:white;border:none;border-radius:10px;
  padding:.78rem;font-family:var(--display);font-size:.78rem;font-weight:700;letter-spacing:.08em;
  transition:all .25s var(--ease);
  box-shadow:0 4px 18px rgba(124,58,255,.35);
}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(124,58,255,.45);}
.login-err{color:var(--red);font-size:.8rem;margin-top:.5rem;min-height:1rem;
  font-family:var(--serif);font-style:italic;}

/* ══ LAYOUT ═══════════════════════════════════ */
#app{position:relative;z-index:1;display:grid;grid-template-rows:54px 1fr;height:100svh;}

/* ══ HEADER ════════════════════════════════════ */
.header{
  background:rgba(13,10,20,.9);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.8rem;padding:0 1.4rem;
  backdrop-filter:blur(16px);position:sticky;top:0;z-index:100;
}
.header-logo{
  font-family:var(--display);font-size:.9rem;font-weight:800;
  background:linear-gradient(135deg,var(--v1),var(--p1));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  white-space:nowrap;
}
.header-logo span{
  font-weight:400;font-size:.7rem;letter-spacing:.15em;
  color:var(--text-3);-webkit-text-fill-color:var(--text-3);
  margin-left:.3rem;
}
.header-sep{flex:1;}
.header-count{
  font-family:var(--display);font-size:.62rem;font-weight:600;letter-spacing:.12em;
  color:var(--text-3);white-space:nowrap;
}
.header-btn{
  font-family:var(--display);font-size:.6rem;font-weight:700;letter-spacing:.08em;
  padding:.35rem .8rem;border-radius:7px;
  border:1px solid var(--border);color:var(--text-3);background:transparent;
  transition:all .22s var(--ease);white-space:nowrap;
}
.header-btn:hover{color:var(--v1);border-color:rgba(182,111,255,.3);background:rgba(182,111,255,.06);}
.header-btn.primary{
  background:linear-gradient(135deg,var(--v2),var(--v1));
  color:white;border-color:transparent;
  box-shadow:0 2px 12px rgba(124,58,255,.3);
}
.header-btn.primary:hover{box-shadow:0 4px 18px rgba(124,58,255,.45);transform:translateY(-1px);}

/* ══ BODY ══════════════════════════════════════ */
.body-wrap{display:grid;grid-template-columns:300px 1fr;min-height:0;overflow:hidden;}
@media(max-width:900px){.body-wrap{grid-template-columns:1fr;}}

/* ══ SIDEBAR ═══════════════════════════════════ */
.sidebar{
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
  background:rgba(255,255,255,.018);
}
.sidebar-top{
  padding:.8rem 1rem;border-bottom:1px solid var(--border);
  display:flex;flex-direction:column;gap:.5rem;
}
.search-input{
  background:rgba(255,255,255,.05);border:1.5px solid var(--border);
  border-radius:8px;padding:.45rem .75rem;font-size:.84rem;
  color:var(--text);outline:none;transition:border-color .22s,box-shadow .22s;
}
.search-input:focus{border-color:var(--v1);box-shadow:0 0 0 3px rgba(182,111,255,.1);}
.search-input::placeholder{color:var(--text-3);}
.filter-tabs{display:flex;gap:.3rem;flex-wrap:wrap;}
.ftab{
  font-family:var(--display);font-size:.56rem;font-weight:700;letter-spacing:.1em;
  padding:.24rem .55rem;border-radius:6px;
  border:1px solid var(--border);color:var(--text-3);background:transparent;
  transition:all .2s;
}
.ftab.active,.ftab:hover{color:var(--v1);border-color:rgba(182,111,255,.3);background:rgba(182,111,255,.08);}
.ftab.active{background:rgba(182,111,255,.12);}

.brief-list{flex:1;overflow-y:auto;}
.brief-list::-webkit-scrollbar{width:3px;}
.brief-list::-webkit-scrollbar-thumb{background:rgba(182,111,255,.25);border-radius:2px;}

.brief-item{
  padding:.85rem 1rem;border-bottom:1px solid rgba(255,255,255,.045);
  cursor:pointer;transition:background .18s;position:relative;
}
.brief-item:hover{background:rgba(182,111,255,.05);}
.brief-item.active{
  background:rgba(182,111,255,.08);
  border-left:2px solid var(--v1);
  box-shadow:inset 3px 0 12px rgba(182,111,255,.08);
}
.brief-item-name{
  font-family:var(--serif);font-style:italic;font-size:.97rem;
  color:var(--text);margin-bottom:.25rem;
}
.brief-item-meta{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;}
.brief-item-date{font-family:var(--display);font-size:.56rem;font-weight:600;
  letter-spacing:.08em;color:var(--text-3);}
.type-pill{
  font-family:var(--display);font-size:.52rem;font-weight:700;letter-spacing:.1em;
  padding:.12rem .45rem;border-radius:5px;
}
.type-casamiento{background:rgba(182,111,255,.14);color:var(--v1);}
.type-quinceanera{background:rgba(255,107,176,.14);color:var(--p1);}
.type-cumple_inf{background:rgba(255,157,77,.14);color:var(--o1);}
.type-cumple_adu{background:rgba(0,229,192,.14);color:var(--c1);}
.type-bautismo{background:rgba(136,184,232,.14);color:var(--blue);}
.type-comunion{background:rgba(136,184,232,.14);color:var(--blue);}
.type-baby_shower{background:rgba(255,107,176,.14);color:var(--p1);}
.type-corporativo{background:rgba(255,255,255,.08);color:var(--text-2);}
.type-otro{background:rgba(255,255,255,.08);color:var(--text-2);}

.status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.status-nuevo    {background:var(--amber);}
.status-en_proceso{background:var(--blue);}
.status-completado{background:var(--green);}
.status-pausado  {background:var(--text-3);}

/* ── READ STATUS TICKS ── */
.read-tick{
  margin-left:auto;font-size:.75rem;letter-spacing:-.05em;
  transition:all .3s var(--ease);flex-shrink:0;
}
.read-unread .read-tick{color:var(--text-3);}
.read-read   .read-tick{color:var(--blue);}
.read-working .read-tick{color:var(--v1);text-shadow:0 0 8px rgba(182,111,255,.5);}

/* Dot no leído */
.brief-item.read-unread::after{
  content:'';position:absolute;top:.85rem;right:.9rem;
  width:7px;height:7px;border-radius:50%;
  background:var(--amber);
  box-shadow:0 0 8px var(--amber);
}
.brief-item.read-unread .read-tick{display:none;}

/* Nombre en negrita si no leído */
.brief-item.read-unread .brief-item-name{
  font-weight:600;color:white;
}

/* Notif badge en el título de la pestaña */
.notif-badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:18px;height:18px;border-radius:9px;
  background:linear-gradient(135deg,var(--p2),var(--v1));
  font-family:var(--display);font-size:.58rem;font-weight:800;
  color:white;padding:0 4px;margin-left:.4rem;
  box-shadow:0 2px 8px rgba(255,62,138,.4);
  animation:badgePulse 2s ease-in-out infinite;
}
@keyframes badgePulse{
  0%,100%{box-shadow:0 2px 8px rgba(255,62,138,.4);}
  50%{box-shadow:0 2px 16px rgba(255,62,138,.7),0 0 24px rgba(182,111,255,.3);}
}

/* ── FILTRO NO LEÍDOS ── */
.ftab.unread-tab{position:relative;}

/* ── HTML SECTION ── */
.html-upload-zone{
  border:1.5px dashed var(--border-2);border-radius:10px;
  padding:1.2rem;text-align:center;cursor:pointer;
  transition:all .3s var(--ease);position:relative;
  background:rgba(182,111,255,.03);
}
.html-upload-zone:hover,.html-upload-zone.drag-over{
  border-color:var(--v1);background:rgba(182,111,255,.07);
}
.html-upload-zone input[type=file]{
  position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;
}
.html-upload-icon{font-size:1.6rem;margin-bottom:.4rem;}
.html-upload-label{
  font-family:var(--display);font-size:.65rem;font-weight:700;
  letter-spacing:.1em;color:var(--text-2);
}
.html-upload-hint{font-size:.72rem;color:var(--text-3);margin-top:.2rem;}

.html-saved{
  background:rgba(0,229,192,.06);border:1px solid rgba(0,229,192,.2);
  border-radius:10px;padding:.9rem 1rem;
  display:flex;align-items:center;gap:.8rem;
}
.html-saved-icon{font-size:1.2rem;}
.html-saved-info{flex:1;min-width:0;}
.html-saved-name{
  font-family:var(--display);font-size:.68rem;font-weight:700;
  color:var(--c1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.html-saved-size{font-size:.62rem;color:var(--text-3);}
.html-saved-actions{display:flex;gap:.4rem;flex-shrink:0;}
.btn-html-action{
  font-family:var(--display);font-size:.58rem;font-weight:700;letter-spacing:.06em;
  padding:.35rem .7rem;border-radius:6px;cursor:pointer;transition:all .2s;
  border:1px solid var(--border-2);color:var(--text-2);background:transparent;
}
.btn-html-action:hover{color:var(--text);border-color:var(--border-2);background:var(--surface-2);}
.btn-html-action.danger{color:var(--red);border-color:rgba(255,107,138,.2);}
.btn-html-action.danger:hover{background:rgba(255,107,138,.08);}

/* ── NOTIF BELL BUTTON ── */
.bell-btn{
  font-size:1rem;padding:.32rem .55rem;position:relative;
  border-radius:7px;border:1px solid var(--border);
  background:transparent;color:var(--text-3);
  transition:all .22s;cursor:pointer;
}
.bell-btn:hover{color:var(--amber);border-color:rgba(255,157,77,.3);background:rgba(255,157,77,.06);}
.bell-btn.active{color:var(--amber);border-color:rgba(255,157,77,.4);
  box-shadow:0 0 12px rgba(255,157,77,.2);}
.bell-dot{
  position:absolute;top:3px;right:3px;width:7px;height:7px;
  border-radius:50%;background:var(--p2);
  box-shadow:0 0 6px var(--p2);
  display:none;
}
.bell-btn.has-new .bell-dot{display:block;animation:badgePulse 1.5s infinite;}

.empty-list{padding:2.5rem 1rem;text-align:center;
  font-family:var(--serif);font-style:italic;color:var(--text-3);font-size:.9rem;}

/* ══ DETAIL ════════════════════════════════════ */
.detail{flex:1;overflow-y:auto;padding:1.4rem 1.6rem;}
.detail::-webkit-scrollbar{width:3px;}
.detail::-webkit-scrollbar-thumb{background:rgba(182,111,255,.2);border-radius:2px;}
.detail-empty{
  display:flex;align-items:center;justify-content:center;height:100%;
  font-family:var(--serif);font-style:italic;color:var(--text-3);font-size:1rem;
  flex-direction:column;gap:.8rem;
}
.detail-empty::before{
  content:'✦';font-style:normal;font-size:2rem;
  background:linear-gradient(135deg,var(--v1),var(--p1));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  opacity:.4;
}

.detail-header{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:1rem;margin-bottom:1.4rem;flex-wrap:wrap;
}
.detail-name{font-family:var(--serif);font-style:italic;font-size:1.8rem;color:var(--text);}
.detail-sub{
  font-family:var(--display);font-size:.58rem;font-weight:600;
  letter-spacing:.15em;text-transform:uppercase;color:var(--text-3);margin-top:.25rem;
}
.detail-actions{display:flex;gap:.5rem;flex-wrap:wrap;}

.status-select{
  font-family:var(--display);font-size:.6rem;font-weight:700;letter-spacing:.08em;
  background:rgba(255,255,255,.05);border:1px solid var(--border-2);border-radius:8px;
  padding:.36rem .75rem;color:var(--text);cursor:pointer;outline:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'><path d='M0 0L5 6L10 0' fill='none' stroke='rgba(182,111,255,.6)' stroke-width='1.3'/></svg>");
  background-repeat:no-repeat;background-position:right .55rem center;background-size:8px;
  padding-right:1.7rem;-webkit-appearance:none;
  transition:border-color .2s;
}
.status-select:focus{border-color:var(--v1);outline:none;}
.status-select option{background:#1a1228;color:var(--text);}

/* ══ SECTIONS ══════════════════════════════════ */
.detail-section{
  background:rgba(255,255,255,.025);border:1px solid var(--border);
  border-radius:14px;padding:1.1rem 1.2rem;margin-bottom:.9rem;
  position:relative;overflow:hidden;
  transition:border-color .25s;
}
.detail-section::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(182,111,255,.3),transparent);
  opacity:0;transition:opacity .3s;
}
.detail-section:hover::before{opacity:1;}

.section-title{
  font-family:var(--display);font-size:.6rem;font-weight:800;
  letter-spacing:.18em;text-transform:uppercase;
  background:linear-gradient(135deg,var(--v1),var(--p1));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:.9rem;padding-bottom:.5rem;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.5rem;
}
.section-title::before{
  content:'';width:12px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--v1),var(--p1));
  flex-shrink:0;-webkit-text-fill-color:initial;
  display:inline-block;
}

.field-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.8rem;}
.field-item{display:flex;flex-direction:column;gap:.22rem;}
.field-key{
  font-family:var(--display);font-size:.56rem;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);
}
.field-val{font-family:var(--serif);font-size:.94rem;color:var(--text);line-height:1.5;}
.field-val.empty{color:var(--text-3);font-style:italic;}

/* Edit mode */
.field-edit input,.field-edit textarea,.field-edit select{
  width:100%;background:rgba(255,255,255,.05);
  border:1.5px solid var(--border);border-radius:8px;
  padding:.4rem .65rem;color:var(--text);font-size:.88rem;
  outline:none;transition:border-color .2s,box-shadow .2s;
}
.field-edit input:focus,.field-edit textarea:focus{
  border-color:var(--v1);box-shadow:0 0 0 3px rgba(182,111,255,.1);
}
.field-edit textarea{min-height:70px;resize:vertical;}

/* Notes */
.admin-notes{
  width:100%;background:rgba(255,255,255,.04);
  border:1.5px solid var(--border);border-radius:10px;
  padding:.65rem .85rem;color:var(--text);font-size:.88rem;
  outline:none;resize:vertical;min-height:80px;
  transition:border-color .2s,box-shadow .2s;line-height:1.65;
}
.admin-notes:focus{border-color:var(--v1);box-shadow:0 0 0 3px rgba(182,111,255,.1);}

/* Trivia */
.trivia-row{
  padding:.45rem 0;border-bottom:1px solid rgba(255,255,255,.05);
  display:grid;grid-template-columns:24px 1fr;gap:.6rem;align-items:baseline;
}
.trivia-row:last-child{border-bottom:none;}
.trivia-n{
  font-family:var(--display);font-size:.6rem;font-weight:800;
  background:linear-gradient(135deg,var(--v1),var(--p1));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.trivia-q{font-family:var(--serif);font-size:.88rem;color:var(--text);}
.trivia-opts{font-size:.78rem;color:var(--text-3);margin-top:.1rem;line-height:1.5;}
.trivia-ans{color:var(--c1);font-weight:700;}

/* ══ MODAL PROMPT ══════════════════════════════ */
.modal-overlay{
  position:fixed;inset:0;z-index:600;
  background:rgba(5,3,10,.92);backdrop-filter:blur(12px);
  display:none;align-items:center;justify-content:center;padding:1.5rem;
}
.modal-overlay.open{display:flex;animation:fadeIn .25s var(--ease);}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.modal-box{
  background:rgba(255,255,255,.04);border:1px solid var(--border-2);
  border-radius:18px;width:100%;max-width:680px;max-height:88vh;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 32px 80px rgba(0,0,0,.6),0 0 0 1px rgba(182,111,255,.1);
  position:relative;
}
.modal-box::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--v1),var(--p1),transparent);
}
.modal-head{
  padding:1.2rem 1.4rem 1rem;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.modal-title{
  font-family:var(--display);font-size:.72rem;font-weight:800;
  letter-spacing:.15em;text-transform:uppercase;
  background:linear-gradient(135deg,var(--v1),var(--p1));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.modal-close{
  background:none;border:1px solid var(--border);border-radius:6px;
  color:var(--text-3);font-size:.82rem;padding:.2rem .5rem;
  transition:all .2s;cursor:pointer;
}
.modal-close:hover{color:var(--text);border-color:var(--border-2);}

.modal-body{flex:1;overflow-y:auto;padding:1.2rem 1.4rem;display:flex;flex-direction:column;gap:.8rem;}
.modal-body::-webkit-scrollbar{width:3px;}
.modal-body::-webkit-scrollbar-thumb{background:rgba(182,111,255,.25);border-radius:2px;}

.prompt-hint{
  font-family:var(--serif);font-style:italic;font-size:.84rem;
  color:var(--text-3);line-height:1.6;
}
.prompt-textarea{
  flex:1;min-height:340px;
  background:rgba(0,0,0,.25);
  border:1.5px solid var(--border);border-radius:10px;
  padding:.9rem 1rem;color:var(--text);
  font-family:'DM Mono','Courier New',monospace;font-size:.78rem;line-height:1.7;
  outline:none;resize:none;transition:border-color .2s;
}
.prompt-textarea:focus{border-color:var(--v1);}

.modal-foot{
  padding:.9rem 1.4rem;border-top:1px solid var(--border);
  display:flex;gap:.6rem;justify-content:flex-end;flex-shrink:0;
}
.btn-copy-prompt{
  font-family:var(--display);font-size:.68rem;font-weight:700;letter-spacing:.08em;
  padding:.65rem 1.6rem;border-radius:8px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--v2),var(--v1),var(--p2));
  color:white;box-shadow:0 4px 18px rgba(124,58,255,.35);
  transition:all .25s var(--ease);
}
.btn-copy-prompt:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(124,58,255,.45);}
.btn-copy-prompt.copied{background:linear-gradient(135deg,var(--c2),var(--c1));}

/* Confirm dialog */
.confirm-overlay{
  position:fixed;inset:0;z-index:700;
  background:rgba(5,3,10,.88);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:1rem;
}
.confirm-overlay.open{display:flex;animation:fadeIn .2s var(--ease);}
.confirm-box{
  background:rgba(255,255,255,.05);border:1px solid var(--border-2);
  border-radius:14px;padding:1.8rem 1.6rem;max-width:380px;text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.5);
}
.confirm-icon{font-size:2rem;margin-bottom:.6rem;}
.confirm-title{font-family:var(--display);font-size:.9rem;font-weight:700;color:var(--text);margin-bottom:.4rem;}
.confirm-msg{font-family:var(--serif);font-style:italic;font-size:.88rem;color:var(--text-2);margin-bottom:1.3rem;line-height:1.6;}
.confirm-btns{display:flex;gap:.6rem;justify-content:center;}
.btn-confirm-cancel{
  font-family:var(--display);font-size:.65rem;font-weight:700;letter-spacing:.08em;
  padding:.6rem 1.2rem;border-radius:8px;
  border:1px solid var(--border-2);color:var(--text-2);background:transparent;
  cursor:pointer;transition:all .2s;
}
.btn-confirm-cancel:hover{color:var(--text);border-color:var(--text-3);}
.btn-confirm-ok{
  font-family:var(--display);font-size:.65rem;font-weight:700;letter-spacing:.08em;
  padding:.6rem 1.2rem;border-radius:8px;
  border:none;background:linear-gradient(135deg,#c0392b,#e74c3c);
  color:white;cursor:pointer;transition:all .2s;
  box-shadow:0 4px 14px rgba(192,57,43,.35);
}
.btn-confirm-ok:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(192,57,43,.5);}

.toast{
  position:fixed;bottom:1.6rem;left:50%;
  transform:translateX(-50%) translateY(12px);z-index:900;
  background:rgba(20,14,30,.97);border:1px solid var(--v1);
  border-radius:10px;padding:.6rem 1.4rem;
  font-family:var(--display);font-size:.68rem;font-weight:600;letter-spacing:.06em;
  color:var(--text);opacity:0;transition:all .3s var(--ease);
  pointer-events:none;white-space:nowrap;
  backdrop-filter:blur(12px);box-shadow:0 8px 32px rgba(182,111,255,.2);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.error{border-color:var(--red);box-shadow:0 8px 32px rgba(255,107,138,.2);}
</style>
</head>
<body>

<!-- BG -->
<div class="bg">
  <div class="bg-mesh"></div>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>
  <div class="bg-orb orb-c"></div>
  <div class="bg-grid"></div>
  <div class="bg-noise"></div>
</div>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">Bether</div>
    <div class="login-studio">Studio · Admin</div>
    <div class="login-rule"></div>
    <div class="login-sub">Panel de administración</div>
    <input class="login-input" type="password" id="pwInput" placeholder="••••••••"
      onkeydown="if(event.key==='Enter')checkLogin()">
    <button class="login-btn" onclick="checkLogin()">INGRESAR</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header class="header">
    <div class="header-logo">Bether <span>STUDIO</span></div>
    <div class="header-sep"></div>
    <span class="header-count" id="headerCount"></span>
    <button class="bell-btn" id="bellBtn" onclick="toggleNotif()" title="Notificaciones push">
      🔔<div class="bell-dot" id="bellDot"></div>
    </button>
    <button class="header-btn" onclick="loadBriefings()">↺ ACTUALIZAR</button>
    <button class="header-btn" onclick="confirmLimpiar()" style="color:var(--red);border-color:rgba(255,107,138,.2);">🗑 LIMPIAR PRUEBAS</button>
    <button class="header-btn" onclick="exportCSV()">EXPORTAR CSV</button>
    <button class="header-btn primary" onclick="logout()">SALIR</button>
  </header>

  <div class="body-wrap">
    <aside class="sidebar">
      <div class="sidebar-top">
        <input class="search-input" type="text" placeholder="Buscar briefing…" oninput="filterList(this.value)">
        <div class="filter-tabs">
          <button class="ftab active" onclick="setFilter('all',this)">TODOS</button>
          <button class="ftab unread-tab" onclick="setFilter('unread',this)" id="unreadTab">NO LEÍDOS</button>
          <button class="ftab" onclick="setFilter('nuevo',this)">NUEVOS</button>
          <button class="ftab" onclick="setFilter('en_proceso',this)">EN PROCESO</button>
          <button class="ftab" onclick="setFilter('completado',this)">LISTOS</button>
          <button class="ftab" onclick="setFilter('casamiento',this)">BODA</button>
          <button class="ftab" onclick="setFilter('quinceanera',this)">XV</button>
        </div>
      </div>
      <div class="brief-list" id="briefList"></div>
    </aside>

    <main class="detail" id="detailPanel">
      <div class="detail-empty">Seleccioná un briefing para ver los detalles</div>
    </main>
  </div>
</div>

<!-- MODAL PROMPT EDITABLE -->
<div class="modal-overlay" id="promptModal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title">✦ PROMPT PARA CLAUDE</div>
      <button class="modal-close" onclick="closePromptModal()">✕</button>
    </div>
    <div class="modal-body">
      <p class="prompt-hint">Revisá y editá el prompt antes de copiarlo. Podés ajustar cualquier detalle directamente acá.</p>
      <textarea class="prompt-textarea" id="promptTextarea" spellcheck="false"></textarea>
    </div>
    <div class="modal-foot">
      <button class="modal-close" onclick="closePromptModal()">CERRAR</button>
      <button class="btn-copy-prompt" id="btnCopyPrompt" onclick="copyPromptFromModal()">COPIAR Y PEGAR EN CLAUDE ✦</button>
    </div>
  </div>
</div>

<!-- CONFIRM ELIMINAR -->
<div class="confirm-overlay" id="confirmModal">
  <div class="confirm-box">
    <div class="confirm-icon" id="confirmIcon">🗑</div>
    <div class="confirm-title" id="confirmTitle">¿Eliminar briefing?</div>
    <p class="confirm-msg" id="confirmMsg">Esta acción no se puede deshacer.</p>
    <div class="confirm-btns">
      <button class="btn-confirm-cancel" onclick="closeConfirm()">CANCELAR</button>
      <button class="btn-confirm-ok" id="confirmOkBtn">ELIMINAR</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ══ CONFIG ══ */
const CONFIG = {
  SUPABASE_URL:         'https://seyalkexqssticszgwkg.supabase.co',
  SUPABASE_SERVICE_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNleWFsa2V4cXNzdGljc3pnd2tnIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3OTMwMjI2MiwiZXhwIjoyMDk0ODc4MjYyfQ.Fay2A2Q2ZrUhtEHhMipjI4r6E8uJaQaVOx5Mmx0KiJI',
  ADMIN_PASSWORD:       'Betiana19',
};

const TYPE_LABELS = {
  casamiento:'💍 Boda', quinceanera:'🌸 XV', cumple_inf:'🎈 Infantil',
  cumple_adu:'🥂 Adulto', bautismo:'🕊️ Bautismo', comunion:'✝️ Comunión',
  baby_shower:'🍼 Baby', corporativo:'🏢 Corp.', otro:'✨ Otro',
};

/* ══ LOGIN ══ */
function checkLogin() {
  const val = document.getElementById('pwInput').value;
  if (val === CONFIG.ADMIN_PASSWORD) {
    document.getElementById('loginScreen').classList.add('hidden');
    loadBriefings();
  } else {
    document.getElementById('loginErr').textContent = 'Contraseña incorrecta';
    setTimeout(() => document.getElementById('loginErr').textContent = '', 2500);
  }
}
function logout() {
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('pwInput').value = '';
}
window.addEventListener('load', () => setTimeout(() => document.getElementById('pwInput')?.focus(), 300));

/* ══ STATE ══ */
let allBriefings = [], currentFilter = 'all', currentSearch = '', selectedId = null, editMode = false;

/* ══ SUPABASE ══ */
async function sbFetch(path, opts = {}) {
  const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      'apikey': CONFIG.SUPABASE_SERVICE_KEY,
      'Authorization': `Bearer ${CONFIG.SUPABASE_SERVICE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || 'return=representation',
    },
    ...opts,
  });
  if (!res.ok) throw new Error(await res.text());
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

/* ══ LOAD ══ */
async function loadBriefings() {
  try {
    allBriefings = await sbFetch('briefings?select=*&order=created_at.desc');
    renderList();
    const sel = allBriefings.find(b => b.id === selectedId);
    if (sel) renderDetail(sel);
    else document.getElementById('detailPanel').innerHTML = '<div class="detail-empty">Seleccioná un briefing para ver los detalles</div>';
    document.getElementById('headerCount').textContent = `${allBriefings.length} BRIEFINGS`;
  } catch(e) { showToast('Error al cargar: ' + e.message, true); }
}

/* ══ LIST ══ */
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.ftab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}
function filterList(v) { currentSearch = v.toLowerCase(); renderList(); }

function displayName(b) {
  return b.couple_display || b.girl_display || b.g_display || b.g_name || b.g_company
    || (b.bride_name && b.groom_name ? `${b.bride_name} & ${b.groom_name}` : null) || '—';
}
function displayDate(b) {
  return b.event_date || b.party_date || b.g_date || '';
}

function renderList() {
  let data = [...allBriefings];
  if (['nuevo','en_proceso','completado','pausado'].includes(currentFilter))
    data = data.filter(b => b.status === currentFilter);
  else if (currentFilter === 'unread')
    data = data.filter(b => b.read_status === 'unread' || !b.read_status);
  else if (currentFilter !== 'all')
    data = data.filter(b => b.event_type === currentFilter);
  if (currentSearch)
    data = data.filter(b => [displayName(b), b.contact_name, b.contact_email]
      .filter(Boolean).some(s => s.toLowerCase().includes(currentSearch)));

  const list = document.getElementById('briefList');
  if (!data.length) { list.innerHTML = '<div class="empty-list">Sin resultados</div>'; return; }

  const tickMap = { unread:'✓', read:'✓✓', working:'✓✓' };
  const tickColor = { unread:'var(--text-3)', read:'var(--blue)', working:'var(--v1)' };

  list.innerHTML = data.map(b => {
    const name = displayName(b);
    const date = displayDate(b);
    const created = new Date(b.created_at).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
    const rs = b.read_status || 'unread';
    const tick = tickMap[rs] || '✓';
    const tColor = tickColor[rs] || 'var(--text-3)';
    return `<div class="brief-item read-${rs} ${b.id===selectedId?'active':''}" onclick="selectBriefing('${b.id}')">
      <div class="brief-item-name">${name}</div>
      <div class="brief-item-meta">
        <div class="status-dot status-${b.status}"></div>
        <span class="type-pill type-${b.event_type}">${TYPE_LABELS[b.event_type]||b.event_type}</span>
        <span class="brief-item-date">${date}</span>
        <span class="read-tick" style="color:${tColor};margin-left:auto;">${tick}</span>
        ${b.final_html ? '<span style="font-size:.7rem;opacity:.6" title="HTML entregado">📄</span>' : ''}
      </div>
    </div>`;
  }).join('');

  // Actualizar badge de no leídos
  const unreadCount = allBriefings.filter(b => !b.read_status || b.read_status === 'unread').length;
  const tab = document.getElementById('unreadTab');
  if (tab) tab.innerHTML = `NO LEÍDOS${unreadCount>0?` <span class="notif-badge">${unreadCount}</span>`:''}`;
  updateBellBadge(unreadCount);
  updatePageTitle(unreadCount);
}

/* ══ DETAIL ══ */
function selectBriefing(id) {
  selectedId = id; editMode = false;
  const b = allBriefings.find(x => x.id === id);
  renderDetail(b); renderList();
}

function renderDetail(b) {
  const isW = b.event_type === 'casamiento';
  const isQ = b.event_type === 'quinceanera';
  const name = displayName(b);
  const date = displayDate(b);
  const created = new Date(b.created_at).toLocaleDateString('es-AR',{day:'2-digit',month:'long',year:'numeric'});
  const typeLabel = TYPE_LABELS[b.event_type] || b.event_type;

  document.getElementById('detailPanel').innerHTML = `
    <div class="detail-header">
      <div>
        <div class="detail-name">${name}</div>
        <div class="detail-sub">${typeLabel} · ${date||'—'} · Recibido ${created}</div>
      </div>
      <div class="detail-actions">
        <select class="status-select" onchange="updateStatus('${b.id}',this.value)">
          <option value="nuevo"       ${b.status==='nuevo'?'selected':''}>● Nuevo</option>
          <option value="en_proceso"  ${b.status==='en_proceso'?'selected':''}>● En proceso</option>
          <option value="completado"  ${b.status==='completado'?'selected':''}>● Completado</option>
          <option value="pausado"     ${b.status==='pausado'?'selected':''}>● Pausado</option>
        </select>
        <button class="header-btn ${editMode?'primary':''}" onclick="toggleEdit('${b.id}')">${editMode?'GUARDAR ✓':'EDITAR'}</button>
        <button class="header-btn" onclick="openPromptModal('${b.id}')" style="color:var(--v1);border-color:rgba(182,111,255,.3);">✦ GENERAR PROMPT</button>
        <button class="header-btn" onclick="deleteBriefing('${b.id}')" style="color:var(--red);border-color:rgba(255,107,138,.2);">ELIMINAR</button>
      </div>
    </div>

    ${section('CONTACTO',[
      {k:'Nombre',  v:b.contact_name},
      {k:'Email',   v:b.contact_email},
      {k:'WhatsApp',v:b.contact_phone},
    ],b,['contact_name','contact_email','contact_phone'])}

    ${isW ? section('LA PAREJA & EL EVENTO',[
      {k:'Novia',         v:b.bride_name},
      {k:'Novio',         v:b.groom_name},
      {k:'Firma',         v:b.couple_display},
      {k:'Iniciales',     v:b.initials},
      {k:'Fecha',         v:b.event_date},
      {k:'Hora',          v:b.event_time},
      {k:'Ceremonia',     v:b.ceremony_venue},
      {k:'Dir. ceremonia',v:b.ceremony_address,full:true},
      {k:'Salón',         v:b.reception_venue},
      {k:'Dir. salón',    v:b.reception_address,full:true},
      {k:'Ciudad / País', v:b.city_country},
      {k:'Dress code',    v:b.dress_code},
    ],b,['bride_name','groom_name','couple_display','initials','event_date','event_time','ceremony_venue','ceremony_address','reception_venue','reception_address','city_country','dress_code']) : ''}

    ${isQ ? section('LA FESTEJADA & EL EVENTO',[
      {k:'Nombre',  v:b.girl_name},
      {k:'Título',  v:b.girl_display},
      {k:'Fecha',   v:b.party_date},
      {k:'Hora',    v:b.party_time},
      {k:'Salón',   v:b.party_venue},
      {k:'Dirección',v:b.party_address,full:true},
      {k:'Ciudad',  v:b.party_city},
    ],b,['girl_name','girl_display','party_date','party_time','party_venue','party_address','party_city']) : ''}

    ${(!isW && !isQ) ? section('EL EVENTO',[
      {k:'Tipo',    v:b.g_event_type},
      {k:'Nombre',  v:b.g_name||b.g_company},
      {k:'Título',  v:b.g_display},
      {k:'Fecha',   v:b.g_date},
      {k:'Hora',    v:b.g_time},
      {k:'Lugar',   v:b.g_venue},
      {k:'Dirección',v:b.g_address,full:true},
      {k:'Ciudad',  v:b.g_city},
    ],b,['g_event_type','g_name','g_display','g_date','g_time','g_venue','g_address','g_city']) : ''}

    ${section('ESTÉTICA',[
      {k:'Tema',      v:b.theme_code ? 'Tema '+b.theme_code : null},
      {k:'Ajustes',   v:b.theme_notes, full:true},
      {k:'Música',    v:b.music_url},
    ],b,['theme_code','theme_notes','music_url'])}

    ${isW ? section('HISTORIA',[
      {k:'Se conocieron', v:b.story_met,       full:true},
      {k:'Primera cita',  v:b.story_first_date, full:true},
      {k:'La propuesta',  v:b.story_proposal,   full:true},
    ],b,['story_met','story_first_date','story_proposal']) : ''}

    ${isW ? section('MESAS',[
      {k:'Cantidad',       v:b.tables_count},
      {k:'Capacidad',      v:b.tables_capacity},
      {k:'Mesa de honor',  v:b.tables_honor?'Sí':'No'},
      {k:'Nombres/números',v:b.tables_names, full:true},
    ],b,['tables_count','tables_capacity','tables_honor','tables_names']) : ''}

    ${isW && b.trivia?.length ? renderTrivia(b.trivia) : ''}

    ${isQ ? section('DETALLES FIESTA',[
      {k:'Vals',        v:b.waltz_song},
      {k:'Sorpresa',    v:b.surprise_dance},
      {k:'Chambelanes', v:b.vals_chambelanes},
    ],b,['waltz_song','surprise_dance','vals_chambelanes']) : ''}

    ${section('TÉCNICO',[
      {k:'URL',       v:b.site_url},
      {k:'Invitados', v:b.guests_count},
      {k:'RSVP',      v:b.wants_rsvp?'Sí':'No'},
      {k:'País',      v:b.country},
    ],b,['site_url','guests_count','wants_rsvp','country'])}

function section(title, fields, b, editFields=[]) {
  return `<div class="detail-section">
    <div class="section-title">${title}</div>
    <div class="field-grid">
      ${fields.map((f,i) => {
        const id = `ef_${f.k.replace(/\W/g,'_')}`;
        const val = f.v != null && f.v !== '' ? f.v : null;
        if (editMode) return `<div class="field-item field-edit" ${f.full?'style="grid-column:1/-1"':''}>
          <div class="field-key">${f.k}</div>
          ${f.full
            ? `<textarea id="${id}" data-field="${editFields[i]||''}">${val||''}</textarea>`
            : `<input type="text" id="${id}" value="${val||''}" data-field="${editFields[i]||''}">`}
        </div>`;
        return `<div class="field-item" ${f.full?'style="grid-column:1/-1"':''}>
          <div class="field-key">${f.k}</div>
          <div class="field-val ${!val?'empty':''}">${val||'—'}</div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function renderTrivia(trivia) {
  if (!trivia?.length) return '';
  return `<div class="detail-section">
    <div class="section-title">TRIVIA</div>
    ${trivia.map((t,i) => `<div class="trivia-row">
      <div class="trivia-n">${i+1}</div>
      <div>
        <div class="trivia-q">${t.q||'—'}</div>
        ${t.a?`<div class="trivia-opts">a) ${t.a} · b) ${t.b} · c) ${t.c} · d) ${t.d} · <span class="trivia-ans">✓ ${t.ans||'a'}</span></div>`:''}
      </div>
    </div>`).join('')}
  </div>`;
}

/* ══ EDIT / SAVE ══ */
function toggleEdit(id) {
  if (editMode) { saveEdits(id); }
  else { editMode = true; renderDetail(allBriefings.find(x=>x.id===id)); }
}
async function saveEdits(id) {
  const updates = {};
  document.querySelectorAll('[data-field]').forEach(el => {
    const f = el.getAttribute('data-field'); if(f) updates[f]=el.value;
  });
  try {
    await sbFetch(`briefings?id=eq.${id}`,{method:'PATCH',body:JSON.stringify(updates),prefer:'return=minimal'});
    const idx=allBriefings.findIndex(b=>b.id===id);
    if(idx>=0) allBriefings[idx]={...allBriefings[idx],...updates};
    editMode=false;
    renderDetail(allBriefings.find(x=>x.id===id));
    renderList();
    showToast('✓ Cambios guardados');
  } catch(e){showToast('Error al guardar: '+e.message,true);}
}
async function updateStatus(id,status) {
  try {
    await sbFetch(`briefings?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({status}),prefer:'return=minimal'});
    const idx=allBriefings.findIndex(b=>b.id===id);
    if(idx>=0) allBriefings[idx].status=status;
    renderList();
    showToast('✓ Estado actualizado');
  } catch(e){showToast('Error: '+e.message,true);}
}
async function saveNotes(id) {
  const notes=document.getElementById('adminNotes')?.value;
  if(notes===undefined) return;
  try {
    await sbFetch(`briefings?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({admin_notes:notes}),prefer:'return=minimal'});
    const idx=allBriefings.findIndex(b=>b.id===id);
    if(idx>=0) allBriefings[idx].admin_notes=notes;
  } catch(e){showToast('Error al guardar nota',true);}
}

async function deleteBriefing(id) {

  showConfirm('🗑', '¿Eliminar briefing?', `"${name}" — Esta acción no se puede deshacer.`, 'ELIMINAR', async () => {

function confirmLimpiar() {
  const hoy = new Date().toLocaleDateString('es-AR');
  showConfirm('🧹', '¿Limpiar registros de prueba?',
    `Se van a eliminar TODOS los briefings marcados como "nuevo" recibidos hoy (${hoy}). Los que tienen estado "en proceso", "completado" o "pausado" no se tocan.`,
    'LIMPIAR', limpiarPruebas);
}

async function limpiarPruebas() {
  const hoy = new Date().toISOString().slice(0,10);
  const pruebas = allBriefings.filter(b => b.status === 'nuevo' && b.created_at?.startsWith(hoy));
  if (!pruebas.length) { showToast('No hay registros de prueba de hoy para eliminar'); return; }
  try {
    for (const b of pruebas) {
      await sbFetch(`briefings?id=eq.${b.id}`,{method:'DELETE',prefer:'return=minimal'});
    }
    allBriefings = allBriefings.filter(b => !(b.status==='nuevo' && b.created_at?.startsWith(hoy)));
    selectedId = null;
    renderList();
    document.getElementById('detailPanel').innerHTML = '<div class="detail-empty">Seleccioná un briefing para ver los detalles</div>';
    showToast(`✓ ${pruebas.length} registros de prueba eliminados`);
  } catch(e){ showToast('Error: '+e.message, true); }
}

/* ══ READ STATUS ══ */
async function setReadStatus(id, status) {
  try {
    await sbFetch(`briefings?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({read_status:status}),prefer:'return=minimal'});
    const idx = allBriefings.findIndex(b=>b.id===id);
    if(idx>=0) allBriefings[idx].read_status = status;
    renderList();
    // Re-render detail to update button states
    const b = allBriefings.find(x=>x.id===id);

    const labels = {unread:'Sin leer', read:'✓✓ Visto', working:'✓✓ Trabajando'};

/* ══ HTML UPLOAD ══ */
async function handleHtmlUpload(input, id) {
  const file = input.files[0]; if(!file) return;
  if(!file.name.endsWith('.html')){ showToast('Solo archivos .html', true); return; }
  const text = await file.text();
  await saveFinalHtml(id, file.name, text);
}
function handleHtmlDrop(event, id) {
  event.preventDefault();
  const zone = document.getElementById('uploadZone_'+id);
  if(zone) zone.classList.remove('drag-over');
  const file = event.dataTransfer.files[0];
  if(!file || !file.name.endsWith('.html')){ showToast('Solo archivos .html', true); return; }
  file.text().then(text => saveFinalHtml(id, file.name, text));
}
async function saveFinalHtml(id, name, html) {
  try {
    showToast('Guardando HTML…');
    await sbFetch(`briefings?id=eq.${id}`,{
      method:'PATCH',
      body:JSON.stringify({final_html:html, final_html_name:name}),
      prefer:'return=minimal'
    });
    const idx = allBriefings.findIndex(b=>b.id===id);
    if(idx>=0){ allBriefings[idx].final_html=html; allBriefings[idx].final_html_name=name; }
    renderDetail(allBriefings.find(x=>x.id===id));
    renderList();
    showToast('✓ HTML guardado — '+name);
  } catch(e){ showToast('Error al guardar: '+e.message, true); }
}
function downloadFinalHtml(id) {
  const b = allBriefings.find(x=>x.id===id); if(!b?.final_html) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([b.final_html],{type:'text/html'}));
  a.download = b.final_html_name || 'invitacion.html';
  a.click();
}
async function deleteFinalHtml(id) {
  try {
    await sbFetch(`briefings?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({final_html:null,final_html_name:null}),prefer:'return=minimal'});
    const idx = allBriefings.findIndex(b=>b.id===id);
    if(idx>=0){ allBriefings[idx].final_html=null; allBriefings[idx].final_html_name=null; }
    renderDetail(allBriefings.find(x=>x.id===id));
    showToast('✓ HTML eliminado');
  } catch(e){ showToast('Error: '+e.message, true); }
}

/* ══ PUSH NOTIFICATIONS ══ */
let notifEnabled = false;
let realtimeSub = null;
let prevCount = 0;

async function toggleNotif() {
  if (notifEnabled) {
    disableNotif();
  } else {
    await enableNotif();
  }
}

async function enableNotif() {
  if (!('Notification' in window)) {
    showToast('Tu navegador no soporta notificaciones', true); return;
  }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') {
    showToast('Permiso de notificaciones denegado', true); return;
  }
  notifEnabled = true;
  document.getElementById('bellBtn').classList.add('active');
  showToast('🔔 Notificaciones activadas');

  // Polling cada 30s para detectar nuevos briefings
  prevCount = allBriefings.length;
  startPolling();
}

function disableNotif() {
  notifEnabled = false;
  document.getElementById('bellBtn').classList.remove('active');
  stopPolling();
  showToast('🔕 Notificaciones desactivadas');
}

let pollingInterval = null;
function startPolling() {
  stopPolling();
  pollingInterval = setInterval(async () => {
    if (!notifEnabled) return;
    try {
      const fresh = await sbFetch('briefings?select=id,created_at,event_type,couple_display,girl_display,g_display,g_name,g_company,read_status&order=created_at.desc&limit=50');
      const newOnes = fresh.filter(b => {
        const existing = allBriefings.find(x=>x.id===b.id);
        return !existing;
      });
      if (newOnes.length > 0) {
        // Hay briefings nuevos!
        newOnes.forEach(b => {
          const name = b.couple_display||b.girl_display||b.g_display||b.g_name||b.g_company||'Nuevo cliente';
          const label = TYPE_LABELS[b.event_type]||b.event_type;
          fireNotification(`✦ Nuevo briefing — ${label}`, name);
        });
        // Recargar lista completa
        await loadBriefings();
      }
    } catch(e) { console.warn('Polling error:', e); }
  }, 30000); // cada 30 segundos
}

function stopPolling() {
  if (pollingInterval) { clearInterval(pollingInterval); pollingInterval = null; }
}

function fireNotification(title, body) {
  if (!notifEnabled || Notification.permission !== 'granted') return;
  const n = new Notification(title, {
    body,
    icon: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="%230d0a14"/><text x="32" y="44" text-anchor="middle" font-size="36">✦</text></svg>',
    badge: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="%23b66fff"/><text x="16" y="22" text-anchor="middle" font-size="18" fill="white">✦</text></svg>',
    tag: 'bether-briefing',
    renotify: true,
    vibrate: [200, 100, 200],
  });
  n.onclick = () => { window.focus(); n.close(); };
  // Sonido via AudioContext
  try {
    const ctx = new AudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(523, ctx.currentTime);
    osc.frequency.setValueAtTime(659, ctx.currentTime + 0.15);
    osc.frequency.setValueAtTime(784, ctx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.65);
  } catch(e) {}
}
